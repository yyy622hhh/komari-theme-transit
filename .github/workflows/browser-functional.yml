name: Browser Functional

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: browser-functional-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install browser engines
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Run browser functional tests
        run: bun run test:functional

      - name: Run large-fleet and long-stability tests
        run: bun run test:performance

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-functional-diagnostics-${{ github.sha }}
          path: |
            test-results/functional/
            playwright-functional-report/
          if-no-files-found: ignore
          retention-days: 14
