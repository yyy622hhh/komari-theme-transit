name: Visual Regression

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    # The committed baselines are produced by visual-baseline.yml on this exact
    # runner, so comparisons stay deterministic and the tolerance can stay tight.
    # Keep this runner in sync with the one used by visual-baseline.yml.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install chromium

      - name: Run visual and accessibility regression tests
        run: bun run test:visual

      - name: Upload visual differences
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: visual-regression-diffs
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
