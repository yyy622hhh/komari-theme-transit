name: Komari Compatibility

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: komari-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        komari-version:
          - 1.2.5-fix2
          - 1.2.6
          - 1.4.2
          - 1.4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build release package
        run: bun run build

      - name: Audit release package
        run: bun run audit:release

      - name: Exercise disposable Komari
        env:
          KOMARI_VERSION: ${{ matrix.komari-version }}
        run: bun run test:komari
