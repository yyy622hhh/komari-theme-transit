name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:check

      - name: Check bundled icons
        run: bun run icons:check

      - name: Type-check
        run: bun run type-check

      - name: Audit source file size
        run: bun run audit:source-size

      - name: Unit tests
        run: bun run test:unit

      - name: Build application
        run: bun run build-only

      - name: Audit initial bundle
        run: bun run audit:bundle

      - name: Record performance budget trend
        run: bun run audit:performance

      - name: Upload performance budget report
        uses: actions/upload-artifact@v6
        with:
          name: performance-budget-${{ github.sha }}
          path: test-results/performance/bundle-performance.json
          if-no-files-found: error
          retention-days: 30

      - name: Audit release package
        run: bun run audit:release

      - name: Verify reproducible release package
        run: bun run audit:reproducible

      - name: Audit dependencies with OSV
        run: bun run audit:dependencies
