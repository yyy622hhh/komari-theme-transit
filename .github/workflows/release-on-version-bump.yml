name: Release On Version Bump

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: write

concurrency:
  group: release-on-version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect theme version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const { execFileSync } = require('node:child_process')
          const { readFileSync } = require('node:fs')

          const zeroSha = '0000000000000000000000000000000000000000'
          const beforeSha = process.env.BEFORE_SHA
          const versionRe = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:0|[1-9]\d*|\d*[A-Z-][0-9A-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Z-][0-9A-Z-]*))*)?(?:\+[0-9A-Z-]+(?:\.[0-9A-Z-]+)*)?$/i

          function compareVersions(left, right) {
            const parse = (version) => {
              const buildIndex = version.indexOf('+')
              const withoutBuild = buildIndex === -1 ? version : version.slice(0, buildIndex)
              const prereleaseIndex = withoutBuild.indexOf('-')
              const core = prereleaseIndex === -1 ? withoutBuild : withoutBuild.slice(0, prereleaseIndex)
              const prerelease = prereleaseIndex === -1 ? '' : withoutBuild.slice(prereleaseIndex + 1)
              return { core: core.split('.').map(Number), prerelease: prerelease ? prerelease.split('.') : [] }
            }
            const a = parse(left)
            const b = parse(right)
            for (let index = 0; index < 3; index += 1) {
              if (a.core[index] !== b.core[index])
                return a.core[index] > b.core[index] ? 1 : -1
            }
            if (!a.prerelease.length || !b.prerelease.length) {
              if (a.prerelease.length === b.prerelease.length)
                return 0
              return a.prerelease.length ? -1 : 1
            }
            const length = Math.max(a.prerelease.length, b.prerelease.length)
            for (let index = 0; index < length; index += 1) {
              const leftPart = a.prerelease[index]
              const rightPart = b.prerelease[index]
              if (leftPart === undefined || rightPart === undefined)
                return leftPart === undefined ? -1 : 1
              if (leftPart === rightPart)
                continue
              const leftNumeric = /^\d+$/.test(leftPart)
              const rightNumeric = /^\d+$/.test(rightPart)
              if (leftNumeric && rightNumeric)
                return Number(leftPart) > Number(rightPart) ? 1 : -1
              if (leftNumeric !== rightNumeric)
                return leftNumeric ? -1 : 1
              return leftPart > rightPart ? 1 : -1
            }
            return 0
          }

          function readJson(filePath) {
            return JSON.parse(readFileSync(filePath, 'utf8'))
          }

          function readJsonAtRevision(revision, filePath) {
            const content = execFileSync('git', ['show', `${revision}:${filePath}`], { encoding: 'utf8' })
            return JSON.parse(content)
          }

          const themeJson = readJson('komari-theme.json')
          const currentVersion = themeJson.version

          if (typeof currentVersion !== 'string' || !versionRe.test(currentVersion)) {
            console.error(`Invalid komari-theme.json version: ${currentVersion}`)
            process.exit(1)
          }

          let previousVersion = ''
          let versionChanged = true

          if (beforeSha && beforeSha !== zeroSha) {
            try {
              previousVersion = readJsonAtRevision(beforeSha, 'komari-theme.json').version ?? ''
              versionChanged = previousVersion !== currentVersion
            }
            catch {
              versionChanged = true
            }
          }

          if (versionChanged && previousVersion) {
            if (typeof previousVersion !== 'string' || !versionRe.test(previousVersion)) {
              console.error(`Invalid previous komari-theme.json version: ${previousVersion}`)
              process.exit(1)
            }
            if (compareVersions(currentVersion, previousVersion) <= 0) {
              console.error(`Theme version must increase: ${previousVersion} -> ${currentVersion}`)
              process.exit(1)
            }
          }

          console.log(`current_version=${currentVersion}`)
          console.log(`previous_version=${previousVersion}`)
          console.log(`version_changed=${versionChanged}`)
          console.log(`release_tag=v${currentVersion}`)
          NODE

      - name: Check release tag state
        id: tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          CURRENT_SHA: ${{ github.sha }}
          VERSION_CHANGED: ${{ steps.version.outputs.version_changed }}
        run: |
          git fetch --force --tags

          if git rev-parse "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            tag_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "sha=${tag_sha}" >> "$GITHUB_OUTPUT"
            if [ "${tag_sha}" = "${CURRENT_SHA}" ]; then
              echo "current=true" >> "$GITHUB_OUTPUT"
            else
              echo "current=false" >> "$GITHUB_OUTPUT"
              if [ "${VERSION_CHANGED}" = "true" ]; then
                echo "Version changed, but tag ${RELEASE_TAG} already exists on ${tag_sha}, not on ${CURRENT_SHA}. Refusing to reuse a released version." >&2
                exit 1
              fi
              echo "Tag ${RELEASE_TAG} already exists on ${tag_sha}; the manifest version is unchanged, so no release is needed."
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when version is unchanged and release tag exists
        if: steps.version.outputs.version_changed != 'true' && steps.tag.outputs.exists == 'true'
        run: |
          echo "komari-theme.json version has not changed and ${{ steps.version.outputs.release_tag }} already exists. Skipping release."

      - name: Wait for required checks on this commit
        if: (steps.version.outputs.version_changed == 'true' || steps.tag.outputs.exists == 'false') && (steps.tag.outputs.exists == 'false' || steps.tag.outputs.current == 'true')
        timeout-minutes: 75
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          required_workflows=(
            "Quality"
            "Visual Regression"
            "Browser Functional"
            "Komari Compatibility"
          )
          deadline=$((SECONDS + 4200))
          all_succeeded=false

          while (( SECONDS < deadline )); do
            response="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${CURRENT_SHA}&per_page=100")"
            waiting=false

            for workflow in "${required_workflows[@]}"; do
              run="$(jq -c --arg workflow "${workflow}" '
                [.workflow_runs[] | select(.name == $workflow and .event == "push")]
                | sort_by(.run_number)
                | last // empty
              ' <<< "${response}")"

              if [[ -z "${run}" ]]; then
                echo "Waiting for ${workflow}: run has not started for ${CURRENT_SHA}."
                waiting=true
                continue
              fi

              status="$(jq -r '.status' <<< "${run}")"
              conclusion="$(jq -r '.conclusion // ""' <<< "${run}")"
              url="$(jq -r '.html_url' <<< "${run}")"

              if [[ "${status}" != "completed" ]]; then
                echo "Waiting for ${workflow}: ${status} (${url})."
                waiting=true
              elif [[ "${conclusion}" != "success" ]]; then
                echo "Required workflow ${workflow} concluded ${conclusion}: ${url}" >&2
                exit 1
              else
                echo "Required workflow ${workflow}: success (${url})."
              fi
            done

            if [[ "${waiting}" == "false" ]]; then
              echo "All required workflows succeeded for ${CURRENT_SHA}."
              all_succeeded=true
              break
            fi

            sleep 15
          done

          if [[ "${all_succeeded}" != "true" ]]; then
            echo "Timed out waiting for required workflows on ${CURRENT_SHA}." >&2
            exit 1
          fi

      - name: Unit tests
        if: steps.version.outputs.version_changed == 'true' || steps.tag.outputs.exists == 'false'
        run: bun run test:unit

      - name: Build project
        if: steps.version.outputs.version_changed == 'true' || steps.tag.outputs.exists == 'false'
        run: bun run build

      - name: Package fixed-purpose route probe
        if: steps.version.outputs.version_changed == 'true' || steps.tag.outputs.exists == 'false'
        run: bun run build:route-probe

      - name: Prepare legacy-import-compatible release assets
        if: steps.version.outputs.version_changed == 'true' || steps.tag.outputs.exists == 'false'
        run: cp scripts/collect-return-route.sh transit-collect-return-route.sh

      - name: Audit initial bundle
        if: steps.version.outputs.version_changed == 'true' || steps.tag.outputs.exists == 'false'
        run: bun run audit:bundle

      - name: Audit release package
        if: steps.version.outputs.version_changed == 'true' || steps.tag.outputs.exists == 'false'
        run: bun run audit:release

      - name: Verify reproducible release package
        if: steps.version.outputs.version_changed == 'true' || steps.tag.outputs.exists == 'false'
        run: bun run audit:reproducible

      - name: Audit dependencies with OSV
        if: steps.version.outputs.version_changed == 'true' || steps.tag.outputs.exists == 'false'
        run: bun run audit:dependencies

      - name: Create and push release tag
        if: (steps.version.outputs.version_changed == 'true' || steps.tag.outputs.exists == 'false') && steps.tag.outputs.exists == 'false'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"

      - name: Create or update GitHub release
        if: (steps.version.outputs.version_changed == 'true' || steps.tag.outputs.exists == 'false') && (steps.tag.outputs.exists == 'false' || steps.tag.outputs.current == 'true')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          preserve_order: true
          files: |
            komari-theme-Transit-build*.zip
            transit-route-probe-plugin.zip
            scripts/transit-route-probe-helper.sh
            transit-collect-return-route.sh

      - name: Verify legacy Komari remote-import asset
        if: (steps.version.outputs.version_changed == 'true' || steps.tag.outputs.exists == 'false') && (steps.tag.outputs.exists == 'false' || steps.tag.outputs.current == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail

          theme_asset="$(basename "$(find . -maxdepth 1 -name 'komari-theme-Transit-build-*.zip' -print -quit)")"
          first_asset="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets[0].name // ""')"

          if [[ -z "${theme_asset}" || "${first_asset}" != "${theme_asset}" ]]; then
            echo "Legacy Komari remote import would download '${first_asset:-<none>}' instead of '${theme_asset:-<missing>}'." >&2
            exit 1
          fi

          echo "Legacy Komari remote import resolves to ${first_asset}."
