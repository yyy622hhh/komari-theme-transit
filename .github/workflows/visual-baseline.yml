name: Visual Baseline

# The pixel baselines must be produced by the same environment that compares
# them. Generating them on a developer laptop leaves a repeatable 2-3% drift
# against the macos-15 runner, which then has to be absorbed by a tolerance
# wide enough to hide real regressions. Run this workflow instead, download the
# artifact and commit the refreshed snapshots.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    # Must stay identical to the runner used by visual-regression.yml.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install chromium

      - name: Regenerate every snapshot
        run: bun run test:visual:baseline

      - name: Upload refreshed snapshots
        uses: actions/upload-artifact@v6
        with:
          name: visual-baseline-snapshots
          path: tests/visual/snapshots/
          if-no-files-found: error
          retention-days: 14
